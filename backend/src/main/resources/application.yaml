app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-make-this-long-and-random-1234567890}
    expiration-ms: 86400000

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moodboard}
    username: ${DB_USERNAME:moodboard}
    password: ${DB_PASSWORD:localdev}
    hikari:
      pool-name: moodboard-pool
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
